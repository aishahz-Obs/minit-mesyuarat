<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log Masuk - Sistem Minit Mesyuarat</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="auth-page">
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <div class="auth-logo">&#9878;</div>
                <h1>Sistem Minit Mesyuarat</h1>
                <p>Hospital Shah Alam</p>
            </div>

            {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
            {% for category, message in messages %}
            <div class="alert alert-{{ category }}">{{ message }}</div>
            {% endfor %}
            {% endif %}
            {% endwith %}

            <form method="POST" action="{{ url_for('login') }}">
                <div class="form-group">
                    <label for="email">Emel</label>
                    <input type="email" id="email" name="email" required autofocus
                           placeholder="contoh@moh.gov.my">
                </div>
                <div class="form-group">
                    <label for="password">Kata Laluan</label>
                    <input type="password" id="password" name="password" required
                           placeholder="Masukkan kata laluan">
                </div>
                <button type="submit" class="btn btn-primary btn-full">Log Masuk</button>
            </form>
            <div class="auth-footer">
                <p>Belum mempunyai akaun? <a href="{{ url_for('register') }}">Daftar di sini</a></p>
            </div>
        </div>
    </div>
</body>
</html>
