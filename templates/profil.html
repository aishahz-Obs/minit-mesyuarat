{% extends 'base.html' %}
{% block title %}Profil Saya{% endblock %}

{% block content %}
<div class="page-header">
    <h2>Profil Saya</h2>
</div>

<div class="card" style="max-width:600px;">
    <div class="profile-info" style="margin-bottom:20px;">
        <div style="margin-bottom:8px;"><strong>Nama:</strong> {{ user['nama'] }}</div>
        <div style="margin-bottom:8px;"><strong>Emel:</strong> {{ user['email'] }}</div>
        <div style="margin-bottom:8px;"><strong>Peranan:</strong>
            <span class="badge {% if user['peranan'] == 'admin' %}badge-primary{% else %}badge-default{% endif %}">
                {{ user['peranan']|capitalize }}
            </span>
        </div>
    </div>

    <form method="POST" action="{{ url_for('profil') }}">
        <div class="form-group">
            <label for="jawatan">Jawatan</label>
            <input type="text" id="jawatan" name="jawatan" value="{{ user['jawatan'] or '' }}" placeholder="cth: Pegawai Perubatan">
        </div>
        <div class="form-group">
            <label for="jabatan">Jabatan</label>
            <input type="text" id="jabatan" name="jabatan" value="{{ user['jabatan'] or '' }}" placeholder="cth: Pentadbiran">
        </div>
        <div class="form-actions">
            <button type="submit" class="btn btn-primary">Kemaskini Profil</button>
        </div>
    </form>
</div>
{% endblock %}
