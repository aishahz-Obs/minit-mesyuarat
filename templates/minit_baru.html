{% extends 'base.html' %}
{% block title %}Minit Baru{% endblock %}

{% block content %}
<div class="page-header">
    <h2>Cipta Minit Mesyuarat Baru</h2>
    <a href="{{ url_for('dashboard') }}" class="btn btn-secondary">Kembali</a>
</div>

<div class="card">
    <form method="POST" action="{{ url_for('minit_baru') }}">
        <div class="form-row">
            <div class="form-group flex-2">
                <label for="tajuk_mesyuarat">Tajuk Mesyuarat <span class="required">*</span></label>
                <input type="text" id="tajuk_mesyuarat" name="tajuk_mesyuarat" required
                       placeholder="cth: MORBIDITI DAN MORTALITI PERINATAL">
            </div>
            <div class="form-group flex-1">
                <label for="bil">Bilangan <span class="required">*</span></label>
                <input type="text" id="bil" name="bil" required placeholder="cth: 1/2026">
            </div>
        </div>

        <div class="form-group">
            <label for="hospital">Hospital</label>
            <input type="text" id="hospital" name="hospital" value="HOSPITAL SHAH ALAM">
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="tarikh">Tarikh</label>
                <input type="date" id="tarikh" name="tarikh">
            </div>
            <div class="form-group">
                <label for="masa_mula">Masa Mula</label>
                <input type="time" id="masa_mula" name="masa_mula">
            </div>
            <div class="form-group">
                <label for="masa_tamat">Masa Tamat</label>
                <input type="time" id="masa_tamat" name="masa_tamat">
            </div>
        </div>

        <div class="form-group">
            <label for="tempat">Tempat</label>
            <input type="text" id="tempat" name="tempat" value="Bilik Persidangan, Aras 2">
        </div>

        <div class="form-actions">
            <button type="submit" class="btn btn-primary">Cipta &amp; Teruskan Sunting</button>
            <a href="{{ url_for('dashboard') }}" class="btn btn-secondary">Batal</a>
        </div>
    </form>
</div>
{% endblock %}
