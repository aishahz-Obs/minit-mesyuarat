{% extends "base.html" %}
{% block title %}Tukar Kata Laluan{% endblock %}

{% block content %}
<div class="page-header">
    <h2>Tukar Kata Laluan</h2>
</div>

<div class="card" style="max-width:500px;">
    <form method="POST" action="{{ url_for('tukar_kata_laluan') }}">
        <div class="form-group">
            <label for="current_password">Kata Laluan Semasa</label>
            <input type="password" id="current_password" name="current_password" required>
        </div>
        <div class="form-group">
            <label for="new_password">Kata Laluan Baru</label>
            <input type="password" id="new_password" name="new_password" required minlength="6">
            <small style="color:#666;">Sekurang-kurangnya 6 aksara</small>
        </div>
        <div class="form-group">
            <label for="confirm_password">Sahkan Kata Laluan Baru</label>
            <input type="password" id="confirm_password" name="confirm_password" required minlength="6">
        </div>
        <div style="display:flex; gap:10px;">
            <button type="submit" class="btn btn-primary">Tukar Kata Laluan</button>
            <a href="{{ url_for('dashboard') }}" class="btn">Batal</a>
        </div>
    </form>
</div>
{% endblock %}
